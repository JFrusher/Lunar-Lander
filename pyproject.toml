[project]
name = "lunar-lander-lab"
version = "0.1.0"
description = "Classical control and RL experiments on Gymnasium's LunarLander-v3."
requires-python = ">=3.10,<3.13"
dependencies = [
    "gymnasium[box2d]>=1.0.0",
    "stable-baselines3>=2.3.0",
    "torch>=2.2.0",
    "matplotlib>=3.8.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
]

[project.optional-dependencies]
# Kept out of the core install so anyone who just wants to fly the lander
# doesn't pull a test/lint toolchain. imageio is for scripts/record_demo.py.
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "imageio>=2.34",
]

[project.scripts]
lunar-lander = "lunar_lander_lab.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Slow tests (real Gymnasium episodes, real PPO training) are excluded by
# default so the common case stays fast. Run them with `pytest -m slow`, or
# the whole suite with `pytest -m ""`.
addopts = "-m 'not slow'"
markers = [
    "slow: touches a real environment or trains a real model",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Pinned explicitly rather than relying on ruff's defaults, which have widened
# between releases — an unpinned set means a ruff update can fail CI with no
# code change. Pyflakes (real bugs: undefined names, unused imports) plus
# essential pycodestyle and import sorting.
select = ["E4", "E7", "E9", "F", "I"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["lunar_lander_lab*"]

[tool.setuptools.package-data]
lunar_lander_lab = ["configs/*.json"]
