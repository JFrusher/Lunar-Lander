name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # gymnasium[box2d] builds box2d-py from source, which needs swig.
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y swig

      - name: Install package
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Test (fast)
        run: pytest

      # Real environments and real PPO training. Slower, so it runs as its own
      # step rather than gating the fast feedback above.
      - name: Test (slow)
        run: pytest -m slow
